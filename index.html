<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f7">
<link rel="manifest" href="/manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
<title>Дневной бюджет</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --input:#ffffff; --text:#131316;
    --muted:#86868b; --line:#e6e6ea; --ok:#0f8a5f; --bad:#d3392f;
    --warn:#a16207; --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg:#0d0d0f; --card:#161619; --input:#0f0f12; --text:#f2f2f5;
      --muted:#8b8b93; --line:#26262c; --ok:#35d399; --bad:#ff6f64;
      --warn:#fbbf24;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  main{max-width:640px;margin:0 auto;padding:34px 20px 90px}
  header{margin-bottom:18px}
  h1{font-size:23px;font-weight:650;letter-spacing:-.02em;margin:0}
  .sub{color:var(--muted);font-size:13px;margin:5px 0 0}
  h2{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;
    color:var(--muted);margin:0 0 14px;}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:4px;margin-bottom:16px;}
  .tabs button{height:38px;font:inherit;font-size:14px;font-weight:550;background:none;
    border:none;border-radius:10px;color:var(--muted);cursor:pointer;
    transition:background .15s,color .15s;}
  .tabs button.active{background:var(--text);color:var(--card)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin-bottom:14px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{display:block;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
  input,select{width:100%;min-width:0;height:42px;margin-top:6px;padding:0 12px;
    font:inherit;color:inherit;background:var(--input);border:1px solid var(--line);
    border-radius:11px;outline:none;transition:border-color .15s, box-shadow .15s;}
  input::placeholder{color:var(--muted);opacity:.7}
  input:focus,select:focus{border-color:var(--muted);box-shadow:0 0 0 3px rgba(128,128,140,.12)}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 10px;
    margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
  .stat{display:flex;flex-direction:column;gap:3px;min-width:0}
  .stat .k{font-size:10px;line-height:1.25;text-transform:uppercase;letter-spacing:.07em;
    color:var(--muted);font-weight:600;}
  .stat .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;
    letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stat .v.ok{color:var(--ok)}
  .stat .v.bad{color:var(--bad)}
  
  .btn{display:block;width:100%;height:44px;margin-top:14px;font:inherit;font-weight:550;
    color:var(--card);background:var(--text);border:none;border-radius:12px;
    cursor:pointer;transition:opacity .15s;}
  .btn:hover{opacity:.86}
  .btn:active{opacity:.72}
  .btn:disabled,.btn:disabled:hover{opacity:.35;cursor:default}
  .btn-outline{display:block;width:100%;height:42px;margin-top:12px;font:inherit;font-weight:600;
    font-size:13px;color:var(--text);background:transparent;border:1px solid var(--line);
    border-radius:11px;cursor:pointer;transition:background .15s;}
  .btn-outline:hover{background:rgba(128,128,128,.05)}
  
  .link-btn{margin-top:12px;padding:0;font:inherit;font-size:12.5px;font-weight:550;
    color:var(--muted);background:none;border:none;cursor:pointer;
    text-decoration:underline;text-underline-offset:2px;}
  .link-btn:hover{color:var(--text)}
  
  .day{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:12px;animation:appear .25s ease;}
  @keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .day.flash{animation:flash .9s ease}
  @keyframes flash{0%{box-shadow:0 0 0 3px rgba(128,128,140,.35)}
    100%{box-shadow:0 0 0 0 rgba(128,128,140,0)}}
  
  .day-head{display:flex;justify-content:space-between;align-items:flex-start;
    gap:12px;margin-bottom:12px;}
  .day-head-left{min-width:0}
  .day-date{font-weight:600;font-size:15px;letter-spacing:-.01em}
  .day-budget{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .day-head-right{display:flex;align-items:center;gap:6px;flex:none}
  
  .day-del{width:28px;height:28px;padding:0;margin:-4px -4px 0 0;
    display:grid;place-items:center;font-size:17px;line-height:1;
    color:var(--muted);background:transparent;border:none;border-radius:50%;
    cursor:pointer;opacity:.5;transition:opacity .15s,color .15s,background .15s;}
  .day-del:hover{opacity:1;color:var(--bad);background:rgba(211,57,47,.09)}
  
  .day-edit{width:28px;height:28px;padding:0;margin:-4px -4px 0 0;
    display:grid;place-items:center;font-size:15px;line-height:1;
    color:var(--muted);background:transparent;border:none;border-radius:50%;
    cursor:pointer;opacity:.5;transition:opacity .15s,color .15s,background .15s;}
  .day-edit:hover{opacity:1;color:var(--text);background:rgba(128,128,128,.09)}

  .action-btn{height:28px;padding:0 10px;font:inherit;font-size:12px;font-weight:600;
    border-radius:8px;cursor:pointer;border:none;}
  .action-btn.save{background:var(--text);color:var(--card);}
  .action-btn.cancel{background:transparent;color:var(--muted);}
  .action-btn.cancel:hover{color:var(--text)}

  /* Форма добавления вынесена вверх */
  .day-form{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .day-form select,.day-form input{margin-top:0;height:42px}
  .day-form select{flex:1;min-width:0}
  .day-form input{width:96px;flex:none}
  .day-form .add{flex:none;width:42px;height:42px;padding:0;display:grid;place-items:center;
    font-size:19px;line-height:1;font-weight:400;color:var(--card);background:var(--text);
    border:none;border-radius:11px;cursor:pointer;transition:opacity .15s;}
  .day-form .add:hover{opacity:.86}
  .day-form .add:active{opacity:.72}

  .expenses{list-style:none;margin:0 0 12px;padding:0}
  .expenses:empty{display:none}
  .expense{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;
    border-bottom:1px solid var(--line);}
  .expense:last-child{border-bottom:none}
  .expense .cat{flex:1;min-width:0;color:var(--muted);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .expense .amt{font-weight:550;font-variant-numeric:tabular-nums}
  
  /* Итоговая строка без верхней разделительной линии */
  .total-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 4px; padding-top: 8px;
    font-weight: 650; border-bottom: none !important;
  }
  .total-row .cat { flex: 1; color: var(--text); font-weight: 650; }
  .total-row .amt { color: var(--text); font-weight: 650; font-size: 15px; }

  .del{border:none;background:none;cursor:pointer;color:var(--muted);font-size:17px;
    line-height:1;padding:2px 5px;border-radius:7px;opacity:.45;
    transition:opacity .15s,color .15s;}
  .del:hover{opacity:1;color:var(--bad)}

  /* Футер с остатком */
  .day-foot{display:flex;justify-content:space-between;align-items:center;
    gap:12px; margin-top:12px;padding-top:11px;border-top:1px solid var(--line);}
  .day-total{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;
    letter-spacing:-.01em;}
  .day-total.ok{color:var(--ok)}
  .day-total.over{color:var(--bad)}
  .day-total.neutral{color:var(--muted);font-weight:500}

  /* Кнопка Завершить */
  .finish-btn{flex:none;height:32px;padding:0 14px;font:inherit;font-size:12.5px;
    font-weight:600;color:var(--card);background:var(--text);border:none;
    border-radius:8px;cursor:pointer;white-space:nowrap;transition:opacity .15s;}
  .finish-btn:hover{opacity:.86}

  /* Статусы завершения */
  .status-badge{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:6px;white-space:nowrap;}
  .status-badge.ok{color:var(--ok);background:rgba(15,138,95,0.1);}
  .status-badge.warn{color:var(--warn);background:rgba(161,98,7,0.1);}
  .status-badge.bad{color:var(--bad);background:rgba(211,57,47,0.1);}
  @media (prefers-color-scheme: dark){
    .status-badge.ok{background:rgba(53,211,153,0.1);}
    .status-badge.warn{background:rgba(251,191,36,0.1);}
    .status-badge.bad{background:rgba(255,111,100,0.1);}
  }

  .stats-summary{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;
    margin:0 0 14px;}
  .stats-summary b{color:var(--text);font-weight:650}
  .stat-row{padding:10px 0;border-bottom:1px solid var(--line)}
  .stat-row:first-child{padding-top:0}
  .stat-row:last-child{border-bottom:none;padding-bottom:0}
  .stat-top{display:flex;align-items:baseline;gap:10px;font-size:14px}
  .stat-dot{flex:none;align-self:center;width:9px;height:9px;border-radius:50%;
    box-shadow:0 0 0 1px rgba(0,0,0,.06);}
  @media (prefers-color-scheme: dark){.stat-dot{box-shadow:0 0 0 1px rgba(255,255,255,.08)}}
  .stat-cat{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stat-sum{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .stat-pct{flex:none;width:56px;text-align:right;font-size:12px;
    color:var(--muted);font-variant-numeric:tabular-nums;}
  .stat-bar{height:4px;margin-top:7px;border-radius:2px;background:var(--line);overflow:hidden}
  .stat-bar i{display:block;height:100%;border-radius:2px}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:26px 0 8px}
  
  /* Стили для модального окна пополнения копилки */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center;
    z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-content {
    background: var(--card); border-radius: var(--radius); padding: 24px;
    width: 90%; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    transform: translateY(10px); transition: transform 0.2s ease;
  }
  .modal-overlay.open .modal-content { transform: none; }
  .modal-content h3 { margin: 0 0 16px; font-size: 16px; font-weight: 650; }
  .modal-content input { height: 48px; font-size: 18px; text-align: center; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions button { flex: 1; height: 44px; margin-top: 0; }

  .auth-wrap{max-width:360px;margin:0 auto;padding:60px 20px 40px}
  .auth-card{background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:22px;}
  .auth-card h2{font-size:16px;text-transform:none;letter-spacing:-.01em;
    color:var(--text);font-weight:650;margin:0 0 16px;}
  .auth-card label + label{margin-top:12px}
  .auth-msg{margin-top:12px;font-size:12.5px;min-height:18px;color:var(--bad)}
  .auth-msg.ok{color:var(--ok)}
  .auth-switch{margin-top:14px;font-size:12.5px;color:var(--muted);text-align:center}
  .auth-switch button{background:none;border:none;padding:0;cursor:pointer;font:inherit;
    font-weight:600;color:var(--text);text-decoration:underline;text-underline-offset:2px;}
  .signout{display:block;margin:0;font-size:12px;color:var(--muted);background:none;
    border:none;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0;}
  .signout:hover{color:var(--text)}
  .user-bar{display:flex;justify-content:space-between;align-items:center;
    gap:12px;margin-bottom:14px;font-size:12px;color:var(--muted);}
  .user-bar .email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  
  @media (max-width:520px){
    main{padding:26px 14px 80px}
    .row{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr);gap:14px 10px}
  }
</style>
</head>
<body>

<div id="auth-screen" class="auth-wrap">
  <header style="margin-bottom:18px;text-align:center">
    <h1>Дневной бюджет</h1>
    <p class="sub">Войдите, чтобы синхронизировать данные</p>
  </header>
  <div class="auth-card">
    <h2 id="auth-title">Вход</h2>
    <form id="auth-form" autocomplete="on">
      <label>Email
        <input id="auth-email" type="email" autocomplete="username" placeholder="you@example.com" required>
      </label>
      <label>Пароль
        <input id="auth-pass" type="password" autocomplete="current-password" placeholder="Минимум 6 символов" required>
      </label>
      <button class="btn" id="auth-submit" type="submit">Войти</button>
    </form>
    <div class="auth-msg" id="auth-msg"></div>
    <div class="auth-switch">
      <span id="auth-switch-text">Нет аккаунта?</span>
      <button type="button" id="auth-switch-btn">Зарегистрироваться</button>
    </div>
  </div>
</div>

<main id="app" style="display:none">
  <div class="user-bar">
    <span class="email" id="user-email"></span>
    <button type="button" class="signout" id="signout-btn">Выйти</button>
  </div>
  <header style="margin-bottom:18px">
    <h1 style="font-size:22px">Дневной бюджет</h1>
    <p class="sub">Сколько можно тратить в день до зарплаты</p>
  </header>
  
  <nav class="tabs" aria-label="Разделы">
    <button type="button" data-tab="main" class="active">Основная</button>
    <button type="button" data-tab="history">История</button>
    <button type="button" data-tab="stats">Статистика</button>
  </nav>

  <div class="tabpane" id="tab-main">
    <section class="card">
      <div class="row">
        <label>Сумма на руках
          <input id="amount" type="number" step="any" min="0" inputmode="decimal" placeholder="0">
        </label>
        <label>Дата зарплаты
          <input id="salaryDate" type="date">
        </label>
      </div>
      <button type="button" class="btn-outline" id="add-savings-btn">Докинуть в копилку</button>
      
      <div class="stats">
        <div class="stat"><span class="k">Дней</span><span class="v" id="stDays">—</span></div>
        <div class="stat"><span class="k">В день</span><span class="v" id="stPerDay">—</span></div>
        <div class="stat"><span class="k">Потрачено сегодня</span><span class="v" id="stToday">—</span></div>
        <div class="stat"><span class="k">Накоплено</span><span class="v" id="stSaved">—</span></div>
      </div>
    </section>
    <section class="card">
      <h2>Новый расход</h2>
      <form id="expenseForm" autocomplete="off">
        <label>Дата<input id="eDate" type="date"></label>
        <button class="btn" id="addDayBtn" type="submit">Добавить расход</button>
      </form>
    </section>
    <div id="daysMain"></div>
  </div>

  <div class="tabpane" id="tab-history" hidden>
    <div id="daysHistory"></div>
  </div>

  <div class="tabpane" id="tab-stats" hidden>
    <section class="card">
      <h2>Период</h2>
      <div class="row">
        <label>С даты<input id="statsFrom" type="date"></label>
        <label>По дату<input id="statsTo" type="date"></label>
      </div>
      <button type="button" class="link-btn" id="statsReset">Сбросить фильтр</button>
    </section>
    <section class="card">
      <h2>По категориям</h2>
      <div id="statsResult"></div>
    </section>
  </div>
</main>

<!-- Модальное окно для копилки -->
<div class="modal-overlay" id="savings-modal">
  <div class="modal-content">
    <h3>Докинуть в копилку</h3>
    <input type="number" id="modal-savings-input" step="any" min="0" inputmode="decimal" placeholder="Сумма">
    <div class="modal-actions">
      <button type="button" class="btn" style="background: var(--line); color: var(--text);" id="modal-cancel">Отмена</button>
      <button type="button" class="btn" id="modal-save">Добавить</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    onAuthStateChanged,
    signOut,
    setPersistence,
    browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore,
    doc,
    setDoc,
    onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCQWWHKZ900flC_GwtpXRJTemphyNwtxzM",
    authDomain: "tsarmoneycontrol.firebaseapp.com",
    projectId: "tsarmoneycontrol",
    storageBucket: "tsarmoneycontrol.firebasestorage.app",
    messagingSenderId: "723839416563",
    appId: "1:723839416563:web:c62c98778452e0e1881f86"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  setPersistence(auth, browserLocalPersistence).catch(() => {});

  /* ---------- константы ---------- */
  const CATS = [
    'Еда на улице',
    'Обеды на работе',
    'Одежда',
    'Детское',
    'Подарки',
    'Средства для ухода',
    'Услуги по уходу',
    'Развлечения',
    'В дом',
    'Еда/Химия',
    'Транспорт',
    'Машина',
    'Займы',
    'Сервисы/Подписки',
    'Иные списания'
  ];

  const CAT_COLORS = {
    'Еда на улице':       '#f97316',
    'Обеды на работе':    '#ca8a04',
    'Одежда':             '#a855f7',
    'Детское':            '#ec4899',
    'Подарки':            '#ef4444',
    'Средства для ухода': '#06b6d4',
    'Услуги по уходу':    '#14b8a6',
    'Развлечения':        '#6366f1',
    'В дом':              '#16a34a',
    'Еда/Химия':          '#65a30d',
    'Транспорт':          '#0284c7',
    'Машина':             '#be123c',
    'Займы':              '#78716c',
    'Сервисы/Подписки':   '#3b82f6',
    'Иные списания':      '#64748b'
  };

  const CATEGORY_RENAMES = {
    'Бытовые нужды': 'Еда/Химия'
  };

  const $ = s => document.querySelector(s);
  const nf = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 });
  const pctFmt = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 1 });
  const money = n => nf.format(Math.round(n * 100) / 100) + ' ₽';

  /* ---------- даты ---------- */
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayISO = () => iso(new Date());
  const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);

  const fmtDay = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long' });
  const fmtWd = new Intl.DateTimeFormat('ru-RU', { weekday: 'short' });
  function dayLabel(key) {
    const d = parseISO(key);
    const label = `${fmtDay.format(d)}, ${fmtWd.format(d)}`;
    return key === todayISO() ? `Сегодня · ${label}` : label;
  }

  /* ---------- состояние ---------- */
  const emptyState = () => ({
    amount: '',
    salaryDate: '',
    savings: 0,
    days: {},
    saved: {},
    covered: {},
    deducted: {},
    finished: {},
    calc: null
  });

  let state = emptyState();
  let userDocRef = null;
  let unsubscribeSnapshot = null;
  let isApplyingRemote = false;
  let saveTimer = null;

  let editingDay = null;
  let editBackup = null;

  function normalizeState(p) {
    if (!p || typeof p !== 'object') return emptyState();

    const days = (p.days && typeof p.days === 'object' && !Array.isArray(p.days)) ? p.days : {};
    Object.keys(days).forEach(key => {
      const list = days[key];
      if (!Array.isArray(list)) return;
      list.forEach(item => {
        if (item && CATEGORY_RENAMES[item.category]) {
          item.category = CATEGORY_RENAMES[item.category];
        }
      });
    });

    return {
      amount: typeof p.amount === 'string' ? p.amount : '',
      salaryDate: typeof p.salaryDate === 'string' ? p.salaryDate : '',
      savings: Number.isFinite(p.savings) ? p.savings : 0,
      days,
      saved: (p.saved && typeof p.saved === 'object') ? p.saved : {},
      covered: (p.covered && typeof p.covered === 'object') ? p.covered : {},
      deducted: (p.deducted && typeof p.deducted === 'object') ? p.deducted : {},
      finished: (p.finished && typeof p.finished === 'object') ? p.finished : {},
      calc: (p.calc && typeof p.calc === 'object' && Number.isFinite(p.calc.perDay)) ? p.calc : null
    };
  }

  function save() {
    if (!userDocRef) return;
    if (isApplyingRemote) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      setDoc(userDocRef, state).catch(err => {
        console.error('Не удалось сохранить в Firestore:', err);
      });
    }, 250);
  }

  /* ---------- расчёты ---------- */
  function recalc() {
    const raw = state.amount === '' ? NaN : parseFloat(state.amount);
    const amount = Number.isFinite(raw) && raw >= 0 ? raw : null;

    let days = null;
    if (state.salaryDate) {
      const d = diffDays(todayISO(), state.salaryDate);
      if (d >= 0) days = d + 1;
    }

    if (amount !== null && days !== null) {
      state.calc = { perDay: amount / days, days, baseAmount: amount, salaryDate: state.salaryDate };
    } else {
      state.calc = null;
    }
    save();
  }

  const perDay = () => (state.calc ? state.calc.perDay : null);
  const sumOf = list => list.reduce((s, x) => s + x.amount, 0);
  const keysSorted = () => Object.keys(state.days).sort();

  function currentDaysLeft() {
    if (!state.salaryDate) return null;
    const d = diffDays(todayISO(), state.salaryDate);
    return d >= 0 ? d + 1 : null;
  }

  /* ---------- сводка ---------- */
  function updateStats() {
    const daysLeft = currentDaysLeft();
    const pd = perDay();

    $('#stDays').textContent = daysLeft !== null ? daysLeft : '—';
    $('#stPerDay').textContent = pd !== null ? money(pd) : '—';

    const todaySpent = sumOf(state.days[todayISO()] || []);
    const tEl = $('#stToday');
    tEl.textContent = money(todaySpent);
    tEl.classList.remove('ok', 'bad');
    if (pd !== null) {
      if (todaySpent > pd) tEl.classList.add('bad');
      else tEl.classList.add('ok');
    }

    $('#stSaved').textContent = money(state.savings || 0);
  }

  /* ---------- карточка дня ---------- */
  function buildDay(key) {
    const pd = perDay();
    const list = state.days[key] || [];
    const total = sumOf(list);

    const isEditing = (editingDay === key);
    const finished = state.finished[key];
    const savedAmount = state.saved[key];
    const coveredAmount = state.covered[key];
    const deductedAmount = state.deducted[key];

    let finishStatus = null;
    if (finished && finished.status) finishStatus = finished.status;
    else if (savedAmount != null) finishStatus = 'saved';
    else if (coveredAmount != null) finishStatus = 'covered';
    else if (deductedAmount != null) finishStatus = 'deducted';

    const isFinished = !!finishStatus;
    const isFuture = key > todayISO();
    
    // Фиксация бюджета для завершённых дней
    const pdDisplay = (finished && Number.isFinite(finished.pd)) ? finished.pd : pd;

    const el = document.createElement('div');
    el.className = 'day';
    el.dataset.date = key;

    /* шапка */
    const head = document.createElement('div');
    head.className = 'day-head';

    const headLeft = document.createElement('div');
    headLeft.className = 'day-head-left';

    const dateEl = document.createElement('div');
    dateEl.className = 'day-date';
    dateEl.textContent = dayLabel(key);

    const budgetEl = document.createElement('div');
    budgetEl.className = 'day-budget';
    budgetEl.textContent = pdDisplay !== null ? `бюджет ${money(pdDisplay)}` : 'бюджет не задан';

    headLeft.append(dateEl, budgetEl);

    const headRight = document.createElement('div');
    headRight.className = 'day-head-right';

    if (isEditing) {
      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.className = 'action-btn cancel';
      cancelBtn.textContent = 'Отмена';
      cancelBtn.onclick = () => {
        if (editBackup) state.days[key] = editBackup;
        editingDay = null;
        editBackup = null;
        render();
      };

      const saveBtn = document.createElement('button');
      saveBtn.type = 'button';
      saveBtn.className = 'action-btn save';
      saveBtn.textContent = 'Сохранить';
      saveBtn.onclick = () => {
        editingDay = null;
        editBackup = null;
        save();
        render();
      };

      headRight.append(cancelBtn, saveBtn);
    } else {
      // Карандаш только для завершённых дней
      if (isFinished) {
        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'day-edit';
        editBtn.innerHTML = '✎';
        editBtn.setAttribute('aria-label', 'Редактировать');
        editBtn.onclick = () => {
          editingDay = key;
          editBackup = JSON.parse(JSON.stringify(state.days[key] || []));
          render();
        };
        headRight.appendChild(editBtn);
      }

      const delDay = document.createElement('button');
      delDay.type = 'button';
      delDay.className = 'day-del';
      delDay.textContent = '×';
      delDay.setAttribute('aria-label', 'Удалить карточку дня');
      delDay.onclick = () => {
        if (!confirm('Удалить карточку этого дня и все её расходы?')) return;
        deleteDay(key);
      };

      headRight.append(delDay);
    }
    head.append(headLeft, headRight);
    el.appendChild(head);

    /* Форма добавления (вынесена наверх) */
    const form = document.createElement('form');
    form.className = 'day-form';
    form.autocomplete = 'off';
    
    if (!isEditing && (isFinished || isFuture)) form.style.display = 'none';

    const sel = document.createElement('select');
    CATS.forEach(c => {
      const o = document.createElement('option');
      o.textContent = c;
      sel.appendChild(o);
    });

    const inp = document.createElement('input');
    inp.type = 'number';
    inp.step = 'any';
    inp.min = '0';
    inp.inputMode = 'decimal';
    inp.placeholder = 'Сумма';

    const add = document.createElement('button');
    add.type = 'submit';
    add.className = 'add';
    add.textContent = '+';
    add.setAttribute('aria-label', 'Добавить трату');

    form.append(sel, inp, add);
    form.addEventListener('submit', e => {
      e.preventDefault();
      if (!isEditing && (isFinished || isFuture)) return;
      const val = parseFloat(inp.value);
      if (!Number.isFinite(val) || val <= 0) { inp.focus(); return; }
      addExpense(key, val, sel.value);
    });
    el.appendChild(form);

    /* Список трат */
    const ul = document.createElement('ul');
    ul.className = 'expenses';
    list.forEach(item => {
      const li = document.createElement('li');
      li.className = 'expense';

      const cat = document.createElement('span');
      cat.className = 'cat';
      cat.textContent = item.category;

      const amt = document.createElement('span');
      amt.className = 'amt';
      amt.textContent = money(item.amount);

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.textContent = '×';
      del.setAttribute('aria-label', 'Удалить');
      
      if (isEditing || (!isFinished && !isFuture)) {
        del.onclick = () => {
          state.days[key] = (state.days[key] || []).filter(x => x.id !== item.id);
          save();
          render();
        };
      } else {
        del.style.display = 'none';
      }

      li.append(cat, amt, del);
      ul.appendChild(li);
    });

    /* Итоговая строка */
    const totalRow = document.createElement('li');
    totalRow.className = 'expense total-row';

    const tCat = document.createElement('span');
    tCat.className = 'cat';
    tCat.textContent = 'Итого';

    const tAmt = document.createElement('span');
    tAmt.className = 'amt';
    tAmt.textContent = money(total);

    totalRow.append(tCat, tAmt);
    ul.appendChild(totalRow);
    el.appendChild(ul);

    /* итог + остаток */
    const foot = document.createElement('div');
    foot.className = 'day-foot';

    const tot = document.createElement('div');
    tot.className = 'day-total';
    if (pdDisplay === null) {
      tot.classList.add('neutral');
      tot.textContent = 'Бюджет не задан';
    } else {
      const diff = pdDisplay - total;
      if (diff >= 0) {
        tot.classList.add('ok');
        tot.textContent = `Остаток: ${money(diff)}`;
      } else {
        tot.classList.add('over');
        tot.textContent = `Перерасход: ${money(-diff)}`;
      }
    }
    foot.appendChild(tot);

    // Кнопка завершения и статусы (в одной строке с остатком)
    if (!isEditing) {
      if (finishStatus === 'saved') {
        const badge = document.createElement('span');
        badge.className = 'status-badge ok';
        badge.textContent = 'Накоплено ✓';
        foot.appendChild(badge);
      } else if (finishStatus === 'covered') {
        const badge = document.createElement('span');
        badge.className = 'status-badge warn';
        badge.textContent = 'Перерасход покрыт ✓';
        foot.appendChild(badge);
      } else if (finishStatus === 'deducted') {
        const badge = document.createElement('span');
        badge.className = 'status-badge bad';
        badge.textContent = 'Сумма пересчитана ✓';
        foot.appendChild(badge);
      } else if (!isFuture && pdDisplay !== null) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'finish-btn';
        btn.textContent = 'Завершить день';
        btn.onclick = () => finishDay(key);
        foot.appendChild(btn);
      }
    }

    el.appendChild(foot);
    return el;
  }

  /* ---------- завершение дня ---------- */
  function finishDay(key) {
    if (!state.calc) return;
    if (state.finished[key] || state.saved[key] != null || state.covered[key] != null || state.deducted[key] != null) return;

    const pd = state.calc.perDay;
    if (pd === null || pd === undefined) return;

    if (!confirm('Завершить день и зафиксировать результат?')) return;

    const list = state.days[key] || [];
    const spent = sumOf(list);
    const overage = spent - pd;
    const available = state.savings || 0;

    let status, baseDelta, savingsDelta;

    if (overage <= 0) {
      const remainder = -overage;
      state.savings = available + remainder;
      state.saved[key] = remainder;
      baseDelta = pd;
      savingsDelta = remainder;
      status = 'saved';
    } else if (available >= overage) {
      state.savings = available - overage;
      state.covered[key] = overage;
      baseDelta = pd;
      savingsDelta = -overage;
      status = 'covered';
    } else {
      const fromPocket = overage - available;
      state.savings = 0;
      state.deducted[key] = overage;
      baseDelta = pd + fromPocket;
      savingsDelta = -available;
      status = 'deducted';
    }

    state.calc.baseAmount = Math.max(0, state.calc.baseAmount - baseDelta);
    state.calc.days = Math.max(1, (state.calc.days || 1) - 1);
    state.calc.perDay = state.calc.baseAmount / state.calc.days;

    state.amount = String(Math.round(state.calc.baseAmount * 100) / 100);
    if (amountInput) amountInput.value = state.amount;

    state.finished[key] = { status, pd, baseDelta, savingsDelta, daysDelta: 1 };

    save();
    render();
  }

  /* ---------- статистика ---------- */
  function collectStats() {
    const from = $('#statsFrom').value || null;
    const to = $('#statsTo').value || null;

    const map = new Map();
    let total = 0;
    let dayCount = 0;

    keysSorted().forEach(k => {
      if (from && k < from) return;
      if (to && k > to) return;
      const list = state.days[k] || [];
      if (!list.length) return;
      dayCount++;
      list.forEach(it => {
        total += it.amount;
        map.set(it.category, (map.get(it.category) || 0) + it.amount);
      });
    });

    const rows = Array.from(map.entries()).sort((a, b) => b[1] - a[1]);
    return { rows, total, dayCount, filtered: !!(from || to) };
  }

  function pluralDays(n) {
    const a = Math.abs(n) % 100;
    const b = a % 10;
    if (a > 10 && a < 20) return 'дней';
    if (b === 1) return 'день';
    if (b >= 2 && b <= 4) return 'дня';
    return 'дней';
  }

  function renderStats() {
    const wrap = $('#statsResult');
    wrap.innerHTML = '';

    const { rows, total, dayCount, filtered } = collectStats();

    if (!rows.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = filtered
        ? 'Нет трат за выбранный период.'
        : 'Пока нет трат. Добавьте расходы в карточках дней.';
      wrap.appendChild(p);
      return;
    }

    const summary = document.createElement('p');
    summary.className = 'stats-summary';
    summary.innerHTML = `Итого: <b>${money(total)}</b> · ${dayCount} ${pluralDays(dayCount)} с тратами`;
    wrap.appendChild(summary);

    rows.forEach(([cat, sum]) => {
      const pct = total > 0 ? (sum / total) * 100 : 0;
      const color = CAT_COLORS[cat] || 'var(--muted)';

      const row = document.createElement('div');
      row.className = 'stat-row';

      const top = document.createElement('div');
      top.className = 'stat-top';

      const dot = document.createElement('span');
      dot.className = 'stat-dot';
      dot.style.background = color;

      const catEl = document.createElement('span');
      catEl.className = 'stat-cat';
      catEl.textContent = cat;

      const sumEl = document.createElement('span');
      sumEl.className = 'stat-sum';
      sumEl.textContent = money(sum);

      const pctEl = document.createElement('span');
      pctEl.className = 'stat-pct';
      pctEl.textContent = pctFmt.format(pct) + '%';

      top.append(dot, catEl, sumEl, pctEl);

      const bar = document.createElement('div');
      bar.className = 'stat-bar';
      const fill = document.createElement('i');
      fill.style.width = Math.min(100, pct) + '%';
      fill.style.background = color;
      bar.appendChild(fill);

      row.append(top, bar);
      wrap.appendChild(row);
    });
  }

  /* ---------- рендер ---------- */
  function render() {
    updateStats();
    renderDays();
    renderStats();
    updateAddButton();
  }

  function renderDays() {
    const keys = keysSorted();

    const mainWrap = $('#daysMain');
    mainWrap.innerHTML = '';
    if (!keys.length) {
      mainWrap.innerHTML = '<p class="empty">Пока нет карточек дней. Выберите дату и нажмите «Добавить расход».</p>';
    } else {
      mainWrap.appendChild(buildDay(keys[keys.length - 1]));
    }

    const histWrap = $('#daysHistory');
    histWrap.innerHTML = '';
    if (!keys.length) {
      histWrap.innerHTML = '<p class="empty">История пуста.</p>';
    } else {
      keys.slice().reverse().forEach(k => histWrap.appendChild(buildDay(k)));
    }
  }

  function updateAddButton() {
    const key = $('#eDate').value || todayISO();
    const exists = !!state.days[key];
    const btn = $('#addDayBtn');
    btn.disabled = exists;
    btn.textContent = exists ? 'Карточка уже создана' : 'Добавить расход';
  }

  /* ---------- действия ---------- */
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function addExpense(key, amount, category) {
    if (!state.days[key]) state.days[key] = [];
    state.days[key].push({ id: uid(), amount, category });
    save();
    render();
    const pane = document.querySelector('.tabpane:not([hidden])');
    const el = pane && pane.querySelector(`.day[data-date="${key}"]`);
    if (el) {
      const inp = el.querySelector('.day-form input');
      if (inp) inp.focus();
    }
  }

  function deleteDay(key) {
    if (editingDay === key) {
      editingDay = null;
      editBackup = null;
    }

    const fin = state.finished[key];
    if (fin && state.calc) {
      state.calc.baseAmount = Math.max(0, state.calc.baseAmount + (fin.baseDelta || 0));
      state.calc.days = Math.max(1, (state.calc.days || 0) + (fin.daysDelta || 1));
      state.calc.perDay = state.calc.baseAmount / state.calc.days;
      state.savings = Math.max(0, (state.savings || 0) - (fin.savingsDelta || 0));
      state.amount = String(Math.round(state.calc.baseAmount * 100) / 100);
      if (amountInput) amountInput.value = state.amount;
    } else {
      if (state.saved[key] != null) {
        state.savings = Math.max(0, (state.savings || 0) - state.saved[key]);
      }
      if (state.covered[key] != null) {
        state.savings = (state.savings || 0) + state.covered[key];
      }
    }

    delete state.saved[key];
    delete state.covered[key];
    delete state.deducted[key];
    delete state.finished[key];
    delete state.days[key];

    save();
    render();
  }

  function setTab(name) {
    document.querySelectorAll('.tabs button').forEach(b =>
      b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tabpane').forEach(p => {
      p.hidden = p.id !== 'tab-' + name;
    });
  }

  function flash(key) {
    const pane = document.querySelector('.tabpane:not([hidden])');
    const el = pane && pane.querySelector(`.day[data-date="${key}"]`);
    if (!el) return;
    el.classList.add('flash');
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    setTimeout(() => el.classList.remove('flash'), 900);
  }

  /* ---------- UI-привязки ---------- */
  const amountInput = $('#amount');
  const salaryInput = $('#salaryDate');
  const eDate = $('#eDate');

  amountInput.addEventListener('input', () => {
    state.amount = amountInput.value;
    recalc();
    render();
  });

  salaryInput.addEventListener('input', () => {
    state.salaryDate = salaryInput.value;
    recalc();
    render();
  });

  eDate.addEventListener('input', updateAddButton);
  eDate.addEventListener('change', updateAddButton);

  $('#expenseForm').addEventListener('submit', e => {
    e.preventDefault();
    const key = eDate.value || todayISO();

    if (!state.days[key]) {
      state.days[key] = [];
      save();
    }

    const keys = keysSorted();
    const isLatest = key === keys[keys.length - 1];
    setTab(isLatest ? 'main' : 'history');
    render();
    flash(key);
  });

  ['statsFrom', 'statsTo'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', renderStats);
    el.addEventListener('change', renderStats);
  });

  $('#statsReset').addEventListener('click', () => {
    $('#statsFrom').value = '';
    $('#statsTo').value = '';
    renderStats();
  });

  document.querySelectorAll('.tabs button').forEach(b => {
    b.addEventListener('click', () => setTab(b.dataset.tab));
  });

  /* ---------- логика модального окна копилки ---------- */
  const savingsModal = $('#savings-modal');
  const modalInput = $('#modal-savings-input');
  const addSavingsBtn = $('#add-savings-btn');

  addSavingsBtn.addEventListener('click', () => {
    modalInput.value = '';
    savingsModal.classList.add('open');
    setTimeout(() => modalInput.focus(), 50);
  });

  $('#modal-cancel').addEventListener('click', () => {
    savingsModal.classList.remove('open');
  });

  savingsModal.addEventListener('click', (e) => {
    if (e.target === savingsModal) savingsModal.classList.remove('open');
  });

  $('#modal-save').addEventListener('click', () => {
    const val = parseFloat(modalInput.value);
    if (Number.isFinite(val) && val > 0) {
      state.savings = (state.savings || 0) + val;
      save();
      render();
      savingsModal.classList.remove('open');
    } else {
      modalInput.focus();
    }
  });

  modalInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('#modal-save').click();
  });

  /* ---------- авторизация ---------- */
  let authMode = 'login';

  const authScreen = $('#auth-screen');
  const appScreen = $('#app');
  const authForm = $('#auth-form');
  const authTitle = $('#auth-title');
  const authSubmit = $('#auth-submit');
  const authMsg = $('#auth-msg');
  const authSwitchText = $('#auth-switch-text');
  const authSwitchBtn = $('#auth-switch-btn');
  const authEmail = $('#auth-email');
  const authPass = $('#auth-pass');
  const userEmail = $('#user-email');

  function setAuthMode(mode) {
    authMode = mode;
    authMsg.textContent = '';
    authMsg.classList.remove('ok');
    if (mode === 'login') {
      authTitle.textContent = 'Вход';
      authSubmit.textContent = 'Войти';
      authPass.autocomplete = 'current-password';
      authSwitchText.textContent = 'Нет аккаунта?';
      authSwitchBtn.textContent = 'Зарегистрироваться';
    } else {
      authTitle.textContent = 'Регистрация';
      authSubmit.textContent = 'Создать аккаунт';
      authPass.autocomplete = 'new-password';
      authSwitchText.textContent = 'Уже есть аккаунт?';
      authSwitchBtn.textContent = 'Войти';
    }
  }

  authSwitchBtn.addEventListener('click', () => {
    setAuthMode(authMode === 'login' ? 'signup' : 'login');
  });

  authForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    authMsg.textContent = '';
    authMsg.classList.remove('ok');

    const email = authEmail.value.trim();
    const pass = authPass.value;

    if (!email || !pass) {
      authMsg.textContent = 'Введите email и пароль.';
      return;
    }
    if (pass.length < 6) {
      authMsg.textContent = 'Пароль должен быть не короче 6 символов.';
      return;
    }

    authSubmit.disabled = true;
    const originalText = authSubmit.textContent;
    authSubmit.textContent = 'Подождите…';

    try {
      if (authMode === 'login') {
        await signInWithEmailAndPassword(auth, email, pass);
      } else {
        await createUserWithEmailAndPassword(auth, email, pass);
      }
    } catch (err) {
      authMsg.textContent = mapAuthError(err);
      authSubmit.disabled = false;
      authSubmit.textContent = originalText;
    }
  });

  function mapAuthError(err) {
    const code = err && err.code ? err.code : '';
    switch (code) {
      case 'auth/invalid-email': return 'Некорректный email.';
      case 'auth/missing-password': return 'Введите пароль.';
      case 'auth/weak-password': return 'Слишком слабый пароль (мин. 6 символов).';
      case 'auth/email-already-in-use': return 'Этот email уже зарегистрирован. Войдите.';
      case 'auth/user-not-found': return 'Аккаунт не найден. Зарегистрируйтесь.';
      case 'auth/wrong-password': return 'Неверный пароль.';
      case 'auth/invalid-credential': return 'Неверный email или пароль.';
      case 'auth/too-many-requests': return 'Слишком много попыток. Попробуйте позже.';
      case 'auth/network-request-failed': return 'Нет соединения с интернетом.';
      case 'auth/unauthorized-domain': return 'Домен не разрешён в Firebase. Добавьте его в Authentication → Settings.';
      default: return 'Ошибка входа: ' + (err && err.message ? err.message : 'неизвестная');
    }
  }

  $('#signout-btn').addEventListener('click', async () => {
    if (unsubscribeSnapshot) {
      unsubscribeSnapshot();
      unsubscribeSnapshot = null;
    }
    userDocRef = null;
    await signOut(auth);
  });

  function attachUser(user) {
    userEmail.textContent = user.email || '';

    userDocRef = doc(db, 'users', user.uid, 'budgetData', 'main');

    if (unsubscribeSnapshot) unsubscribeSnapshot();
    unsubscribeSnapshot = onSnapshot(userDocRef, (snap) => {
      isApplyingRemote = true;
      try {
        if (snap.exists()) {
          state = normalizeState(snap.data());
        } else {
          state = emptyState();
          setDoc(userDocRef, state).catch(() => {});
        }

        if (document.activeElement !== amountInput) amountInput.value = state.amount;
        if (document.activeElement !== salaryInput) salaryInput.value = state.salaryDate;
        render();
      } finally {
        isApplyingRemote = false;
      }
    }, (err) => {
      console.error('Ошибка подписки Firestore:', err);
      isApplyingRemote = false;
    });
  }

  function detachUser() {
    if (unsubscribeSnapshot) {
      unsubscribeSnapshot();
      unsubscribeSnapshot = null;
    }
    userDocRef = null;
    state = emptyState();
    amountInput.value = '';
    salaryInput.value = '';
    render();
  }

  onAuthStateChanged(auth, (user) => {
    if (user) {
      authScreen.style.display = 'none';
      appScreen.style.display = 'block';
      eDate.value = todayISO();
      render();
      attachUser(user);
    } else {
      authScreen.style.display = 'block';
      appScreen.style.display = 'none';
      detachUser();
      setAuthMode('login');
      authPass.value = '';
    }
  });

  setAuthMode('login');
  eDate.value = todayISO();
</script>
</body>
</html>
